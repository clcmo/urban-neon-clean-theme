name: Release
run-name: Release (${{ github.actor }})

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Mesmo grupo do readme.yml: os dois escrevem na main, então rodam um de cada vez.
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  # O publish roda no mesmo workflow, e não por gatilho de tag: tags criadas com o
  # GITHUB_TOKEN pelo Release Please NÃO disparam outros workflows.
  publish:
    name: Empacotar e publicar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:icon
      - run: npm run build:themes
      - run: npm run validate:themes
      - run: npm test
      - run: npm run package:vsix

      - name: Anexar .vsix à GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*.vsix

      - name: Publicar no VS Code Marketplace
        run: npx @vscode/vsce publish --oidc --packagePath dist/urban-neon-clean-theme.vsix

      - name: Publicar no Open VSX
        run: npx ovsx publish --trusted-publishing dist/urban-neon-clean-theme.vsix
