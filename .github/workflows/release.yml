name: Automatic Versioning & VSIX Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  package-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      - name: Generate 128x128 PNG icon with Font Awesome
        run: npm run build:icon

      - name: Build and validate themes
        run: npm run build:themes

      - name: Run unit and integration tests
        run: npm test

      - name: Package .vsix
        run: npm run package:vsix

      - name: Attach .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --oidc --packagePath urban-neon-clean-theme-*.vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish urban-neon-clean-theme-*.vsix -p "$OVSX_PAT"